<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Option Scope</title>
  <desc id="desc">A market scope with an upward options chart</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172b3d"/>
      <stop offset="1" stop-color="#0b141e"/>
    </linearGradient>
    <linearGradient id="orbit" x1="13" y1="16" x2="50" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8bd4ff"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
    <linearGradient id="trend" x1="17" y1="44" x2="48" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27c98a"/>
      <stop offset="1" stop-color="#a5f3d2"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#surface)" stroke="#38566a" stroke-width="2"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#orbit)" stroke-width="2" opacity=".42"/>
  <path d="M32 10v7M32 47v7M10 32h7M47 32h7" stroke="#79c9ff" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <path d="M17 43.5 25 36l6 3 10-15 6 3" fill="none" stroke="#07131d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <path d="M17 43.5 25 36l6 3 10-15 6 3" fill="none" stroke="url(#trend)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="m43 24 4-1-1 4" fill="none" stroke="#b7f7dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="39" r="2.2" fill="#f3bf62" stroke="#fff1c9" stroke-width="1"/>
</svg>
